version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: academy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-academy_dev}
      # Collation matters for Persian text ordering.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # 5436 on the host: 5432/5433/5434/5442 are already taken by other projects.
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - academy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-academy} -d ${POSTGRES_DB:-academy_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  academy_pgdata:
    name: academy_pgdata
